<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nilai Pastel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="kalkulator.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">🍓 Nisak<span>.cute</span></a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-item">Tentang Saya</a></li>
                <li><a href="kalkulator.html" class="nav-item active">Kalkulator Nilai</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        
        <div id="welcomeBox" class="welcome-box hidden">
            ✓ Halaman siap. Masukkan nilai untuk memulai perhitungan.
        </div>

        <div class="calc-card">
            <div class="calc-header">
                <h2 class="calc-title">Kalkulator Nilai Akhir</h2>
                <p class="calc-subtitle">Masukkan nilai tiap komponen untuk menghitung nilai akhir dan grade.</p>
            </div>

            <div class="weight-grid">
                <div class="weight-item">
                    <span>TUGAS</span>
                    <strong>30%</strong>
                </div>
                <div class="weight-item">
                    <span>UTS</span>
                    <strong>30%</strong>
                </div>
                <div class="weight-item">
                    <span>UAS</span>
                    <strong>40%</strong>
                </div>
            </div>

            <form id="calcForm" class="calc-form">
                <div id="errorBox" class="error-box hidden"></div>

                <div class="form-group">
                    <label for="tugas">Nilai Tugas</label>
                    <input type="number" id="tugas" placeholder="Contoh: 85" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="uts">Nilai UTS</label>
                    <input type="number" id="uts" placeholder="Contoh: 78" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="uas">Nilai UAS</label>
                    <input type="number" id="uas" placeholder="Contoh: 80" min="0" max="100">
                </div>

                <button type="button" id="btnHitung" class="btn-hitung">Hitung</button>
            </form>

            <div id="hasilBox" class="hasil-box hidden">
                <h3 class="hasil-title">✨ Hasil Perhitungan ✨</h3>
                <div class="hasil-content">
                    <p>Nilai Akhir Anda: <strong id="txtNilaiAkhir">0.00</strong></p>
                    <div class="grade-container">
                        <span>Grade:</span>
                        <span id="txtGrade" class="grade-badge">-</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="kalkulator.js"></script>
</body>
</html>
